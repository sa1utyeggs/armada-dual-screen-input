name: Build and release offline package
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/build_release.py'
      - 'tools/release*.py'
      - 'tests/test_release_ci.py'
      - 'packaging/dependencies/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  bundle:
    needs: checks
    runs-on: ubuntu-latest
    container: fedora:44
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - name: Install packaging dependencies
        run: dnf -y install git python3 rpm cpio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust only this checkout in the disposable build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate version and prepare release notes
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT_NAME" == push ]]; then
            git merge-base --is-ancestor HEAD origin/main
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python3 -B tools/release_ci.py "${args[@]}" \
            --github-output "$GITHUB_OUTPUT" --notes-file dist/release-notes.md
      - name: Build verified aarch64 bundle
        run: python3 -B tools/build_release.py
      - name: Verify packaged checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: armada-dual-screen-input-aarch64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: armada-dual-screen-input-aarch64
          path: dist
      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.bundle.outputs.tag }}
          RELEASE_VERSION: ${{ needs.bundle.outputs.version }}
          PRERELEASE: ${{ needs.bundle.outputs.prerelease }}
          SOURCE_REVISION: ${{ needs.bundle.outputs.revision }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

          # A moved tag must not publish a package built from a different commit.
          revision=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          kind=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          while [[ "$kind" == tag ]]; do
            object=$(gh api "repos/$GH_REPO/git/tags/$revision")
            revision=$(jq -r '.object.sha' <<< "$object")
            kind=$(jq -r '.object.type' <<< "$object")
          done
          if [[ "$kind" != commit || "$revision" != "$SOURCE_REVISION" ]]; then
            echo 'Remote tag no longer matches the tested source commit.' >&2
            exit 1
          fi

          # Failed uploads stay private as a draft; reruns can finish that draft.
          # Never replace assets on an already published release.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [[ $(cat "$RUNNER_TEMP/release-draft") != true ]]; then
              echo 'Release is already published; use a new version tag.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" --notes-file dist/release-notes.md \
              --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/armada-dual-screen-input-$RELEASE_VERSION-aarch64.tar.gz" \
            dist/SHA256SUMS --clobber
          if [[ "$PRERELEASE" == true ]]; then latest=false; else latest=true; fi
          gh release edit "$RELEASE_TAG" --draft=false \
            --prerelease="$PRERELEASE" --latest="$latest" \
            --title "$RELEASE_TAG" --notes-file dist/release-notes.md
